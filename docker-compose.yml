name: library-nosql-api
services:
  mongodb:
    image: mongo:7
    container_name: library-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_ROOT_USERNAME}", "-p", "${MONGO_ROOT_PASSWORD}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  cassandra:
    image: cassandra:4.1
    container_name: library-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: LibraryCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    ports: ["9042:9042"]
    volumes: [cassandra_data:/var/lib/cassandra]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 90s

  neo4j:
    image: neo4j:5-community
    container_name: library-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "${NEO4J_USERNAME}/${NEO4J_PASSWORD}"
      HEALTHCHECK_NEO4J_USERNAME: ${NEO4J_USERNAME}
      HEALTHCHECK_NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_default__listen__address: 0.0.0.0
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data, neo4j_logs:/logs]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u \"$${HEALTHCHECK_NEO4J_USERNAME}\" -p \"$${HEALTHCHECK_NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 45s

  api:
    build: .
    container_name: library-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CASSANDRA_HOSTS: cassandra
      NEO4J_URI: bolt://neo4j:7687
    ports: ["8000:8000"]
    volumes: ["./app:/app/app"]
    depends_on:
      mongodb: {condition: service_healthy}
      redis: {condition: service_healthy}
      cassandra: {condition: service_healthy}
      neo4j: {condition: service_healthy}

volumes:
  mongo_data:
  redis_data:
  cassandra_data:
  neo4j_data:
  neo4j_logs:
